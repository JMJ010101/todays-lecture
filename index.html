<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>오늘의 강의 - 개발 강의 검색기</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%231d2a4d'/%3E%3Cpath d='M12 6 3 10.5 12 15l7-3.5V16h2v-5.5z' fill='%23ffe066'/%3E%3Cpath d='M7 13v3.2c0 1 2.2 2.3 5 2.3s5-1.3 5-2.3V13l-5 2.5z' fill='%23ffe066'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <script src="config.js"></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header class="header">
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2 9.5 12 5l10 4.5L12 14z"/>
        <path d="M6 11.7V16c0 1.4 2.7 3 6 3s6-1.6 6-3v-4.3"/>
        <path d="M22 9.5V15"/>
      </svg>
    </div>
    <div>
      <h1><span class="marker">오늘의 강의</span></h1>
      <p class="subtitle">오늘 공부할 개발 주제를 찾아보세요</p>
    </div>
  </header>

  <main class="container">
    <form id="searchForm" class="search-form" novalidate>
      <label class="field">
        <svg class="field-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/>
        </svg>
        <input id="searchInput" type="search" placeholder="무엇을 배우고 싶나요? 예: react 입문" autocomplete="off" aria-label="검색어">
      </label>
      <select id="orderSelect" aria-label="정렬">
        <option value="relevance">관련도순</option>
        <option value="date">최신순</option>
      </select>
      <button type="submit">검색</button>
    </form>
    <p id="inputHint" class="input-hint" role="alert"></p>

    <div class="chips" aria-label="추천 검색어">
      <button type="button" class="chip">react 입문</button>
      <button type="button" class="chip">javascript 기초</button>
      <button type="button" class="chip">typescript</button>
      <button type="button" class="chip">css 레이아웃</button>
      <button type="button" class="chip">git github</button>
    </div>

    <p id="status" class="status" role="status" aria-live="polite"></p>
    <section id="results" class="grid" aria-label="검색 결과"></section>

    <div id="emptyState" class="empty-state">
      <svg viewBox="0 0 64 64" width="72" height="72" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M8 14c8-3 16-3 24 2v34c-8-5-16-5-24-2z"/>
        <path d="M56 14c-8-3-16-3-24 2v34c8-5 16-5 24-2z"/>
        <path d="m40 26 9-9 4 4-9 9-5 1z" class="pencil"/>
      </svg>
      <p>검색어를 입력하거나 추천 검색어를 눌러 보세요.</p>
    </div>
  </main>
</body>
</html>
